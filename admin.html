<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard – Online Newspaper</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Admin Script -->
  <script type="module" src="./js/pages/admin.js"></script>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="app-header">
    <div class="header-container">

      <!-- Brand -->
      <div class="brand">
        <span class="brand-logo">📰</span>
        <span class="brand-name">Online Newspaper</span>
      </div>

      <!-- Navigation -->
      <div class="nav-overlay" id="navOverlay"></div>

      <nav class="side-drawer" id="sideDrawer">
        <!-- Drawer Header -->
        <div class="drawer-header">
          <div class="brand">
            <span class="brand-logo">📰</span>
            <div class="brand-text">
              <span class="brand-name">Online News</span>
              <span class="brand-tagline">Delivery System</span>
            </div>
          </div>
        </div>

        <!-- User Section -->
        <div id="drawerUserSection" class="drawer-user-card" style="display: none;">
          <div class="drawer-avatar">
            <i class="fa fa-user"></i>
          </div>
          <div class="drawer-user-info">
            <span id="drawerUserName" class="user-name">Loading...</span>
            <span id="drawerUserRole" class="user-role">User</span>
          </div>
        </div>

        <!-- Navigation Links -->
        <div class="drawer-nav-links">
          <a href="admin.html" class="nav-link" data-page="admin">
            <i class="fa fa-lock"></i> Admin
          </a>
        </div>

        <!-- Drawer Footer -->
        <div class="drawer-footer">
          <button id="signOutDrawer" class="drawer-logout-btn" style="display:none;">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </div>
      </nav>

      <!-- Actions -->
      <div class="header-actions">
        <button id="signOut" class="btn btn-secondary" style="display:none;">
          Sign Out
        </button>
      </div>

      <!-- Hamburger Button -->
      <button id="menuToggle" class="hamburger">
        ☰
      </button>

    </div>
  </header>
  <!-- ========================================== -->


  <!-- ================= ADMIN ================= -->
  <main class="container">

    <!-- ===== Admin Dashboard ===== -->
    <section id="adminDashboard" style="display:block;">

      <!-- Metrics -->
      <div class="dashboard-metrics">
        <div class="card metric-card">
          <h4>Total Revenue</h4>
          <p id="revenueTotal" class="metric-value">₹0</p>
        </div>
      </div>

      <!-- Users Table -->
      <div class="card">
        <h3>User Subscriptions</h3>

        <div class="table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>Plan</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="adminUserRows"></tbody>
          </table>
        </div>
      </div>

    </section>

  </main>
  <!-- =========================================== -->


  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    <p>&copy; 2024 Online Newspaper Delivery System</p>
    <p><strong>Contact:</strong> support@newspaperdelivery.com</p>
  </footer>
  <!-- =========================================== -->

</body>

</html>
